name: Create Release1.6.0.9

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-release-1.6.0.9.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release1.6.0.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Simplified WFC DNS switching

          - Removed the redundant `switch_WFC_DNS_service.bat` menu helper.
          - WiiLink and Wiimmfi/Kaeru WFC are now switched simply by running the corresponding enable script.
          - `enable_WiiLink_WFC.bat` automatically removes the repository-managed Wiimmfi rule before enabling WiiLink.
          - `enable_Wiimmfi_WFC.bat` automatically removes the repository-managed WiiLink rule before enabling Wiimmfi.
          - Kept `show_WFC_DNS_status.bat` for current-state inspection.
          - Kept `remove_WFC_DNS_routing.bat` as the single restore/remove helper.
          - Updated README and technical documentation to match the simplified workflow.

          DNS endpoints:
          - WiiLink WFC: `5.161.56.11`
          - Wiimmfi / Kaeru WFC: `178.62.43.212`
          EOF

          gh release create Release1.6.0.9 \
            --repo "$GITHUB_REPOSITORY" \
            --target "4f8b6c6b37c290e99a93b5d7a9eb2c5d8d6e32ad" \
            --title "Release1.6.0.9" \
            --notes-file release-notes.md
