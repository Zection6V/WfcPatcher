name: Create Release1.6.0.7

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-release-1.6.0.7.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release1.6.0.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## WFC DNS service switching

          - Added `enable_Wiimmfi_WFC.bat` using the Nintendo DS Wiimmfi / Kaeru WFC DNS endpoint `178.62.43.212`.
          - Added `disable_Wiimmfi_WFC.bat`.
          - Added `disable_all_WFC_DNS_routing.bat` to remove both repository-managed WiiLink and Wiimmfi NRPT rules.
          - Added `switch_WFC_DNS_service.bat` for menu-based switching between WiiLink, Wiimmfi, and normal DNS behavior.
          - Updated `enable_WiiLink_WFC.bat` and `enable_Wiimmfi_WFC.bat` so enabling one service automatically removes the other repository-managed rule first.
          - Both services use the `.nintendowifi.net` NRPT namespace with the required leading dot.
          - WiiLink DNS remains `5.161.56.11`.
          - Wiimmfi / Kaeru WFC DNS is `178.62.43.212`.
          - Updated the English/Japanese README and added Wiimmfi/service-switching technical notes and a validation checklist under `docs/`.
          - Kept the legacy `dragAndDropNdsFileToThisBatFile_wiimmfi_de.bat` ROM-patching helper for compatibility.
          EOF

          gh release create Release1.6.0.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target "8c0b0cddef05eca404e6743e605c0a7e1ff5f068" \
            --title "Release1.6.0.7" \
            --notes-file release-notes.md
