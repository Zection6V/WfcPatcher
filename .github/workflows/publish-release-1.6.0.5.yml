name: Publish Release1.6.0.5

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-release-1.6.0.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view Release1.6.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release1.6.0.5 already exists."
            exit 0
          fi

          gh release create Release1.6.0.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "Release1.6.0.5" \
            --notes "Fixed WiiLink WFC connectivity by updating the replacement domain from wiilink24.com to wiilink.ca.\n\nRenamed the WiiLink batch file to dragAndDropNdsFileToThisBatFile_wiilink_ca.bat to match the current WiiLink domain."
