name: Create Release1.6.0.8

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create-release-1.6.0.8.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release1.6.0.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## WFC DNS helper fixes and cleanup

          - Fixed the PowerShell/cmd.exe escaping bug from Release1.6.0.7 that could pass a literal `^` to `Resolve-DnsName` and other commands.
          - Removed PowerShell pipelines from the embedded batch `-Command` strings to eliminate the escaping ambiguity at the root.
          - Added `show_WFC_DNS_status.bat` to display the active service, NRPT namespace, configured DNS server, and current `nas.nintendowifi.net` IPv4 resolution.
          - Simplified cleanup to one `remove_WFC_DNS_routing.bat` script.
          - Removed the redundant `disable_WiiLink_WFC.bat`, `disable_Wiimmfi_WFC.bat`, and `disable_all_WFC_DNS_routing.bat` scripts.
          - Updated `switch_WFC_DNS_service.bat` with WiiLink, Wiimmfi/Kaeru WFC, status, and restore-normal-DNS options.
          - WiiLink and Wiimmfi enable scripts remain mutually exclusive and automatically replace the other repository-managed NRPT rule.
          - Added documentation for error `60000` when switching replacement WFC servers while reusing DS WFC user information.
          - Documented that users should delete/recreate the DS WFC user information after changing servers if error `60000` occurs.
          - Documented the option of keeping separate emulator data/folders to retain independent WFC user information for multiple servers.

          DNS endpoints:
          - WiiLink WFC: `5.161.56.11`
          - Wiimmfi / Kaeru WFC: `178.62.43.212`
          EOF

          gh release create Release1.6.0.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target "da2e25499b8402afd2b00e072120f91063782120" \
            --title "Release1.6.0.8" \
            --notes-file release-notes.md
